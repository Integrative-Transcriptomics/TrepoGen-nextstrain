sources:

  TPA-SS14:
    reference_sample: "CP004011"
    meta_identifier: "sra"

    # Parameters to build the initial tree from this data source.
    tree:
      # The auto substitution model selection may be disabled in the future for runtime increase.
      # E.g., set "--substitution-model HKY+F+ASC+R2", which performed good for source data used so far.
      method_cl: "--method iqtree --substitution-model GTR+ASC+R4 --tree-builder-args='-safe'"

    # Optional command line arguments for tree refinement.
    refine:
      year_bounds_cl: "--year-bounds 2025 2000"
      precision: 3
      iterations: 4
      # The current clock rate is based on https://link.springer.com/article/10.1186/s12915-024-02108-4.
      clock_rate_cl: "--clock-rate 1.26e-7"

    # Metadata fields to infer for ancestral states (internal nodes of the tree).
    traits:
      columns: "subspecies country region date"

    # Additional metadata columns to be included in the Auspice export. These will not be available for coloring.
    export:
      metadata_columns: "Label BioSample BioProject Publication Center Host 'Date (method)'"

    # Data source and metadata description.
    describe: |
      #### Dataset

      The <code>TPA-SS14</code> dataset currently comprises whole-genome variants of 2,473 individual _Treponema pallidum_ ssp. _pallidum_, _pertenue_, and _endemicum_ samples, genotyped against the SS14 reference genome [CP004011](https://www.ncbi.nlm.nih.gov/nuccore/CP004011).
      Variants include **single nucleotide variants (SNVs) and InDels**, providing insight into the full spectrum of sequence changes and featuring the complete phylogenetic context of _T. pallidum_.

      ##### Note
      
      Given that the reported genotyping is based on an SS14 reference genome, reported variants may be reference-biased.
      Consequently, InDels calls, particularly in homopolymeric regions, should be interpreted with caution.
      This extends to gene sequences inferred from the reported variants.

      #### Metadata

      ##### Geotemporal and Sampling Information

      Collection <code>Date</code>, <code>Country</code>, and <code>Region</code> (based on the United Nations Statistics Division M49 standard) are available as metadata.
      The collection dates were either manually abstracted from the original publication or used as the first-public date of respective ENA records.
      The dating method is accessible through the per-node tooltip; it is not available via coloring.
      <code>Read origin</code> is either by generating synthetic reads from assemblies, concatenating reads for individual BioSamples, or individual read runs for individual BioSamples,
      whereas <code>Sample type</code> is differentiated into clinical samples and rabbit passage.
      Information about the <code>Host</code> (human or NHP) is annotated where available.

      ##### Data Quality

      To communicate data quality, the <code>Effective coverage</code> as the mean coverage multiplied by the breadth of coverage (≥5X) per sample is provided.
      Available whole genome sequencing samples with a breadth of coverage below 75% at 5X were excluded from the dataset.
      
      ##### Demographic Information

      Demographic data includes <code>Sex and orientation</code> and <code>Age</code> (split into <18 and 18+ age groups), and was manually abstracted from the original publications, where available.

      ##### Taxonomic Information

      <code>Subspecies</code> designations, including division into the Nichols and SS14 lineages, are available, as are the **sublineage and Bayesian analysis of population structure (BAP) assignments**
      introduced by [Beale _et al._ 2021](https://doi.org/10.1038/s41564-021-01000-z), [Taouk _et al._ 2022](https://doi.org/10.1016/s2666-5247(22)00035-0), and [Sena _et al._ 2024](https://doi.org/10.1016/S2666-5247(24)00087-9).

      The pan-TP SNP-based hierarchical clustering scheme [trepogeno](https://github.com/sanger-pathogens/trepogeno) is provided as <code>trepogeno clusters</code>.
      trepogeno delineates clusters at three hierarchical levels:
      - Level 1 corresponds to the subspecies pallidum (TPA), pertenue (TPE), and endemicum (TEN).
      - Level 2 corresponds to deep branches in the phylogeny, e.g. SS14 (TPA.1) and Nichols (TPA.2).
      - Level 3 corresponds to robust genetic groups defined using BAPS. They do not necessarily form epidemiologically meaningful groups.

      <code>trepogeno concordance</code> values provide a confidence score for the trepogeno cluster assignment.

      ##### Antimicrobial Resistance Monitoring

      In order to monitor **antimicrobial resistance (AMR)** related variants, we annotate:
      - <code>Macrolide resistance</code> mediated by 23S rRNA mutations A2058G (_E. coli_ numbering) and A2059G (_E. coli_ numbering) [PMC 3592075](https://pmc.ncbi.nlm.nih.gov/articles/PMC3592075/).
      - <code>Penicilin-binding protein (TP0705) VOIs</code> comprising the M625V amino acid substitution induced by nucleotide mutation A1873G (TPA numbering),
      which is being monitored for suspected induced resistance to ceftriaxone and penicillin G [PMC 12152143](https://pmc.ncbi.nlm.nih.gov/articles/PMC12152143/).
      - <code>16S rRNA VOIs</code> at positions 967-970, 1057-1059, and 1062 (TPA numbering) as early indicators of suspected emerging doxycycline resistance [PMC12928234](https://pmc.ncbi.nlm.nih.gov/articles/PMC12928234/).

    # Specification of genes to use for this data source.
    genes:
      TP0326:
        describe: |
          TP0326 (BamA) is the central component of the molecular machinery that inserts OMPs into the spirochete's outer membrane.
          TP0326 is bipartite and consists of a predicted 16-stranded β-barrel with eight extracellular loops (ECLs) and five polypeptide transport-associated (POTRA) domains within the periplasm.
          It has been demonstrated that pools of human syphilitic sera from the USA and Colombia exhibited the capacity to recognize both the N-terminal POTRA-containing and C-terminal beta-barrel domains, as well as ECL4.
          This finding suggests that TP0326 stimulates the human immune system and might constitute a potential vaccine target [PMC 4420902](https://pmc.ncbi.nlm.nih.gov/articles/PMC4420902/).

          Additional information on TP0326 can be found at:
          - [UniProt O83346](https://www.uniprot.org/uniprotkb/O83346/entry)
      TP0435:
        describe: |
          TP0435 (also Tp17/Tpp17) is a highly abundant periplasmic lipoprotein [PMC 12154512](https://pmc.ncbi.nlm.nih.gov/articles/PMC12154512/),
          often used for immunoassay diagnostics [PMC 12172048](https://pmc.ncbi.nlm.nih.gov/articles/PMC12172048/).
          Expression of TP0435 in _B. burgdorferi_ was shown to produce multiple isoforms, some of which were shown to be localized at the cell surface [DOI srep25593](https://www.nature.com/articles/srep25593).

          Additional information on TP0435 can be found at:
          - [UniProt P29722](https://www.uniprot.org/uniprotkb/P29722/entry)
      TP0548:
        describe: |
          TP0548 belongs to the FadL family, which facilitates the transport of long-chain fatty acids across the outer membrane, thereby providing essential nutrients for the bacterium.
          Its encoding gene is of particular importance in the context of various typing approaches [PMID 33093286](https://pubmed.ncbi.nlm.nih.gov/33093286/).

          Additional information on TP0548 can be found at:
          - [UniProt O83559](https://www.uniprot.org/uniprotkb/O83559/entry)
      TP0574:
        describe: |
          TP0574 (also Tp47/Tpp47) is a periplasmic major penicillin-binding protein (carboxypeptidase), playing a role in host-pathogen interaction [DOI 10.1155/2017/1436080](https://doi.org/10.1155/2017/1436080),
          and often used for immunoassay diagnostics [PMC 12172048](https://pmc.ncbi.nlm.nih.gov/articles/PMC12172048/).
          It has been demonstrated that TP0574-induced PGE2 production contributes to the inhibition of macrophage phagocytosis, which potentially facilitates immune evasion during infection [PMID 38258964](https://pubmed.ncbi.nlm.nih.gov/38258964/).

          Additional information on TP0574 can be found at:
          - [UniProt P29723](https://www.uniprot.org/uniprotkb/P29723/entry)
      TP0705:
        describe: |
          TP0705 (mrcA) is a periplasmic penicillin-binding protein.
          The M625V amino acid substitution is suspect of reduced susceptibility to penicillin G and ceftriaxone in _T. pallidum_ [PMC 12152143](https://pmc.ncbi.nlm.nih.gov/articles/PMC12152143/).

          Additional information on TP0705 can be found at:
          - [UniProt O83703 ](https://www.uniprot.org/uniprot/O83703/entry)
      TP0751:
        describe: |
          TP0751 (pallilysin) is a multifunctional metalloprotease and vascular adhesin, that facilitates the dissemination of _T. pallidum_ throughout its host by employing its lipocalin domain to firmly attach the bacteria to host cells and components of the extracellular matrix [DOI s41598-017-01589-4](https://www.nature.com/articles/s41598-017-01589-4).

          Additional information on TP0751 can be found at:
          - [UniProt O83732](https://www.uniprot.org/uniprotkb/O83732/entry)
      TP0856:
        describe: |
          TP0856 belongs to the FadL family, which facilitates the transport of long-chain fatty acids across the outer membrane, thereby providing essential nutrients for the bacterium. Studies have identified ECL2 and ECL4 as being highly immunogenic and surface-exposed, thus rendering them excellent candidates for a multivalent syphilis vaccine [PMC 9426418](https://pmc.ncbi.nlm.nih.gov/articles/PMC9426418/).

          Additional information on TP0856 can be found at:
          - [UniProt O83828](https://www.uniprot.org/uniprotkb/O83828/entry)
      TP0858:
        describe: |
          TP0858 belongs to the FadL family, which facilitates the transport of long-chain fatty acids across the outer membrane, thereby providing essential nutrients for the bacterium. Studies have identified ECL2 and ECL4 as being highly immunogenic and surface-exposed, thus rendering them excellent candidates for a multivalent syphilis vaccine [PMC 9426418](https://pmc.ncbi.nlm.nih.gov/articles/PMC9426418/).
          TP0858 is employed to characterize and differentiate _T. pallidum_ subspecies, particularly subsp. _pertenue_, the agent of yaws [PMC 6197692](https://pmc.ncbi.nlm.nih.gov/articles/PMC6197692/).

          Additional information on TP0858 can be found in the following references:
          - [UniProt O83830](https://www.uniprot.org/uniprotkb/O83830/entry)  
      TP0859:
        describe: |
          TP0859 belongs to the FadL family, which facilitates the transport of long-chain fatty acids across the outer membrane, thereby providing essential nutrients for the bacterium.
          TP0859 shows variant proteoforms and recombination in clinical strains, but is still being investigated as a potential vaccine candidate due to its surface exposure [PMC 8407342](https://pmc.ncbi.nlm.nih.gov/articles/PMC8407342/).

          Additional information on TP0859 can be found in the following references:
          - [UniProt O83839](https://www.uniprot.org/uniprotkb/O83839/entry)
      TP0865:
        describe: |
          TP0865 belongs to the FadL family, which facilitates the transport of long-chain fatty acids across the outer membrane, thereby providing essential nutrients for the bacterium.
          TP0865 shows variant proteoforms and recombination in clinical strains, but is still being investigated as a potential vaccine candidate due to its surface exposure [PMC 8407342](https://pmc.ncbi.nlm.nih.gov/articles/PMC8407342/).

          Additional information on TP0865 can be found in the following references:
          - [UniProt O83837](https://www.uniprot.org/uniprotkb/O83837/entry)
